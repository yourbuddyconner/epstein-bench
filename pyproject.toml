[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epstein-bench"
version = "1.0.0"
description = "A verified RAG benchmark over the public Epstein Files corpus"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0.0",
    "numpy>=1.24",
    "openai>=1.0.0",
    "python-dotenv",
    "nltk>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
