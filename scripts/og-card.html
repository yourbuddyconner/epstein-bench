<!DOCTYPE html>
<!-- Source for docs/og-image.png (1200x630 link-preview card). Regenerate with:
  chrome --headless --screenshot=docs/og-image.png --window-size=1200,630 \
    --hide-scrollbars file://$PWD/scripts/og-card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#16150f; color:#ece9e2;
         font-family:Georgia,'Times New Roman',serif; overflow:hidden;
         padding:72px 80px; display:flex; flex-direction:column; }
  .rule { width:64px; height:6px; background:#d47b6a; margin-bottom:22px; }
  .kicker { font-family:ui-monospace,Menlo,monospace; font-weight:700;
         font-size:26px; letter-spacing:.22em; color:#d47b6a; }
  .headline { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .headline p { font-size:88px; line-height:1.12; letter-spacing:-.015em;
         font-weight:700; max-width:1000px; }
  .headline .pct { color:#d47b6a; }
  .foot { font-size:28px; color:#9a968c; }
  .foot b { color:#ece9e2; font-weight:400; }
  .foot .dot { color:#d47b6a; padding:0 .35em; }
</style>
</head>
<body>
  <div>
    <div class="rule"></div>
    <div class="kicker">EPSTEIN BENCH</div>
  </div>
  <div class="headline">
    <p>The best AI gets <span class="pct">54%</span> on the Epstein&nbsp;Files.</p>
  </div>
  <div class="foot">1,038 verified questions<span class="dot">&middot;</span>an
  84,000-document haystack<span class="dot">&middot;</span><b>epsteinbench.com</b></div>
</body>
</html>
