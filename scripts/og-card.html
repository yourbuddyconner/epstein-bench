<!DOCTYPE html>
<!-- Source for docs/og-image.png (1200x630 link-preview card). Regenerate with:
  chrome --headless --screenshot=docs/og-image.png --window-size=1200,630 \
    --hide-scrollbars file://$PWD/scripts/og-card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Libre+Franklin:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#d6d3ca; color:#1b1a17;
         overflow:hidden; padding:64px 76px 56px; display:flex;
         flex-direction:column;
         font-family:'Libre Franklin',system-ui,sans-serif; }
  .rule { width:64px; height:6px; background:#a8231c; margin-bottom:20px; }
  .kicker { font-family:'Courier Prime',monospace; font-weight:700;
         font-size:26px; letter-spacing:.22em; color:#a8231c; }
  .headline { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .headline p { font-weight:900; font-size:92px; line-height:1.06;
         letter-spacing:-.02em; text-transform:uppercase; max-width:1050px; }
  .headline .pct { color:#a8231c; }
  .redact { display:inline-block; background:#141310; color:#141310;
         padding:0 .18em; border-radius:2px; }
  .foot { font-family:'Courier Prime',monospace; font-size:23px; color:#6e6a61;
         white-space:nowrap; }
  .foot b { color:#1b1a17; font-weight:700; }
  .foot .dot { color:#a8231c; padding:0 .35em; }
</style>
</head>
<body>
  <div>
    <div class="rule"></div>
    <div class="kicker">EPSTEIN BENCH</div>
  </div>
  <div class="headline">
    <p>The best AI gets <span class="pct">54%</span> on the
    <span class="redact">Epstein</span> Files.</p>
  </div>
  <div class="foot">1,038 verified questions<span class="dot">&middot;</span>an
  84,000-document haystack<span class="dot">&middot;</span><b>epsteinbench.com</b></div>
</body>
</html>
