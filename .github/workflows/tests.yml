name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run test suite (stub LLM, no API key)
        run: pytest tests -v
        env:
          EPSTEIN_BENCH_STUB_LLM: "1"
